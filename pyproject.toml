[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-flight-recorder"
version = "0.1.0"
description = "Deterministic event recorder, replay, and branching for agent runs"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
recorder = "flight_recorder.cli:main"

[tool.setuptools]
packages = ["flight_recorder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
